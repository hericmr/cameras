<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2a2a2a" />
    <title>Câmeras ao Vivo de Santos</title>
    <script>
      // GitHub Pages não conhece as rotas do React Router: envia a rota original
      // em ?p= para o index.html, que a restaura (ex.: /cameras/camera/123)
      var l = window.location;
      var base = l.pathname.indexOf('/cameras') === 0 ? '/cameras' : '';
      var route = l.pathname.slice(base.length) + l.search;
      l.replace(l.origin + base + '/?p=' + encodeURIComponent(route) + l.hash);
    </script>
  </head>
  <body>
    <noscript>
      Você precisa habilitar o JavaScript para executar esta aplicação.
      <a href="/cameras/">Clique aqui para ir para a página inicial</a>
    </noscript>
  </body>
</html>
