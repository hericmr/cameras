<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2a2a2a" />
  <meta name="description" content="Câmeras ao vivo de Santos - veja a cidade em tempo real" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo512.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">


  <title>Câmeras ao Vivo de Santos</title>

  <style>
    body {
      background-color: #000000;
      color: white;
    }
  </style>
</head>

<body>
  <noscript>Você precisa habilitar o JavaScript para executar esta aplicação.</noscript>
  <div id="root"></div>
</body>
<script>
  (function () {
    // REACT_APP_ prefix is required for Create React App environment variables in index.html
    const SUPABASE_URL = '%REACT_APP_SUPABASE_URL%';
    const SUPABASE_ANON_KEY = '%REACT_APP_SUPABASE_ANON_KEY%';

    // Check if variables are properly replaced
    if (!SUPABASE_URL || SUPABASE_URL.startsWith('%') || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.startsWith('%')) {
      console.warn('Supabase analytics skipped: Environment variables not set.');
      return;
    }

    const data = {
      url: window.location.href,
      user_agent: navigator.userAgent,
      referrer: document.referrer
    };

    fetch(`${SUPABASE_URL}/rest/v1/acessos`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify(data)
    })
      .catch(err => console.error('Erro ao enviar analytics:', err));
  })();
</script>
</body>

</html>
